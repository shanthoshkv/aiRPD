name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md docs/demo.gif; do test -s "$f" || { echo "missing $f"; exit 1; }; done
